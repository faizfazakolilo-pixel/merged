name: Build ESP32 firmware

on:
  push:
  workflow_dispatch:
    inputs:
      esp32_core:
        description: "Versi ESP32 core (Arduino)"
        default: "2.0.17"
      gfx_version:
        description: "Versi library GFX Library for Arduino"
        default: "1.4.9"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pasang arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Pasang ESP32 core
        run: |
          CORE="${{ github.event.inputs.esp32_core }}"
          CORE="${CORE:-2.0.17}"
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@${CORE}"

      - name: Pasang library
        run: |
          GFX="${{ github.event.inputs.gfx_version }}"
          GFX="${GFX:-1.4.9}"
          arduino-cli lib install "GFX Library for Arduino@${GFX}"
          arduino-cli lib install "ChronosESP32"

      - name: Siapkan folder sketch
        run: |
          mkdir -p motor_nav_esp32_v22
          cp motor_nav_esp32_v22.ino partitions.csv standby_photo.h motor_nav_esp32_v22/
          ls -la motor_nav_esp32_v22

      - name: Tambal kompatibilitas core 2.x (ESP-IDF 4)
        run: |
          CORE="${{ github.event.inputs.esp32_core }}"
          CORE="${CORE:-2.0.17}"
          case "$CORE" in
            2.*) sed -i 's/ESP_PARTITION_MMAP_DATA/SPI_FLASH_MMAP_DATA/g' motor_nav_esp32_v22/motor_nav_esp32_v22.ino ;;
          esac
          grep -n "MMAP_DATA" motor_nav_esp32_v22/motor_nav_esp32_v22.ino

      - name: Compile (ESP32 Dev Module, flash 4MB, partisi custom)
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32:FlashSize=4M \
            --build-property upload.maximum_size=1703936 \
            --export-binaries \
            --output-dir out \
            motor_nav_esp32_v22
          ls -la out

      - name: Periksa tabel partisi di hasil build
        run: |
          python3 - << 'PY'
          import glob, struct, sys
          f = glob.glob("out/*.partitions.bin")[0]
          d = open(f, "rb").read()
          ok = False
          for i in range(0, len(d), 32):
              e = d[i:i+32]
              if len(e) < 32 or e[:2] != b"\xaa\x50":
                  continue
              typ, sub, off, size = struct.unpack("<BBII", e[2:12])
              name = e[12:28].split(b"\0")[0].decode()
              print(f"{name:8s} type={typ} sub={sub} offset=0x{off:X} size=0x{size:X}")
              if name == "app0" and size == 0x1A0000:
                  ok = True
          if not ok:
              print("PERINGATAN: partisi app0 bukan 0x1A0000, partitions.csv tidak terpakai!")
              sys.exit(1)
          PY

      - name: Buat merge.bin
        run: |
          ls -la out
          M=$(ls out/*.merged.bin 2>/dev/null | head -n1 || true)
          if [ -n "$M" ]; then
            cp "$M" out/merge.bin
          else
            echo "merged.bin dari core tidak ada, membuat sendiri dengan esptool"
            CORE_DIR=$(ls -d $HOME/.arduino15/packages/esp32/hardware/esp32/*/ | head -n1)
            ET=$(find $HOME/.arduino15/packages/esp32/tools/esptool_py -maxdepth 2 \( -name esptool.py -o -name esptool \) -type f | head -n1)
            echo "esptool: $ET"
            if [[ "$ET" == *.py ]]; then RUN="python3 $ET"; else RUN="$ET"; fi
            $RUN --chip esp32 merge_bin -o out/merge.bin \
              --flash_mode dio --flash_freq 40m --flash_size 4MB \
              0x1000 out/motor_nav_esp32_v22.ino.bootloader.bin \
              0x8000 out/motor_nav_esp32_v22.ino.partitions.bin \
              0xe000 ${CORE_DIR}tools/partitions/boot_app0.bin \
              0x10000 out/motor_nav_esp32_v22.ino.bin
          fi
          ls -la out/merge.bin

      - name: Unggah hasil
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32
          path: out/
